[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-orbitguard"
version = "0.1.0"
description = "AI-Assisted Space Debris Collision Risk Detection & Avoidance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # === Orbital Mechanics (AI-1: Anas) ===
    "sgp4>=2.22",
    "astropy>=6.0",
    "skyfield>=1.48",

    # === Conjunction & Math (AI-2: Rushaan) ===
    "scipy>=1.11",
    "numpy>=1.24",
    "pydantic>=2.0",

    # === Backend (Web: Balaganesh) ===
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "python-dotenv>=1.0",

    # === Shared ===
    "httpx>=0.25",
    "loguru>=0.7",
]

[project.optional-dependencies]
ml = [
    # === ML Risk Ranking (AI-3: Udarsh) ===
    "lightgbm>=4.0",
    "shap>=0.43",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",  # src/ml/ranking/train.py imports this unconditionally
    "python-dateutil>=2.8",  # src/ml/ranking/predictor.py
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.6",
    "pre-commit>=3.5",
]
all = [
    "radar-orbitguard[ml,dev]",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
